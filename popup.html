<html>

<head>
    <title>NoTaZe</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h2>Notes for this page</h2>
    <div>
        <label for="noteSelect">Select note:</label>
        <select id="noteSelect" style="width:100%"></select>
        <button id="newNoteBtn" class="button2" style="width:100%; margin-top:6px">+ New Note</button>
    </div>

    <textarea id="note" rows="10" cols="30" placeholder="Type your thoughts..."></textarea>
    <button id="saveBtn" class="button1">Save</button>
    <p id="status"></p>
    <hr>
    <button id="ViewAll" class="button2">View All Notes</button>

    <script src="content.js"></script>
</body>

</html>
